<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Idle-Isekai</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // FILL_WINDOW = true  -> fill the window, but never wider than MAX_ASPECT.
      //                        Wider windows get black bars on the sides
      //                        (pillarbox); too-tall windows get top/bottom bars.
      // FILL_WINDOW = false -> keep the exact DESIGN aspect ratio, scale to fit.
      var FILL_WINDOW = true;
      var DESIGN_WIDTH = 1280;
      var DESIGN_HEIGHT = 720;

      // Widest / narrowest allowed play area (a ratio of width / height).
      // 16 / 9 = 1.7778. Anything outside these limits gets black bars.
      var MAX_ASPECT = 16 / 9;   // side (pillarbox) limit  -- lower it for narrower
      var MIN_ASPECT = 0;        // top/bottom (letterbox) limit -- 0 = disabled

      function resizeCanvas() {
        var W = window.innerWidth;
        var H = window.innerHeight;
        var w, h;

        if (!FILL_WINDOW) {
          var scale = Math.min(W / DESIGN_WIDTH, H / DESIGN_HEIGHT);
          w = Math.floor(DESIGN_WIDTH * scale);
          h = Math.floor(DESIGN_HEIGHT * scale);
        } else {
          var aspect = W / H;
          if (MAX_ASPECT > 0 && aspect > MAX_ASPECT) {
            // Too wide -> pillarbox: keep height, cap the width, black bars each side.
            h = H;
            w = Math.round(H * MAX_ASPECT);
          } else if (MIN_ASPECT > 0 && aspect < MIN_ASPECT) {
            // Too tall -> letterbox: keep width, cap the height, black bars top/bottom.
            w = W;
            h = Math.round(W / MIN_ASPECT);
          } else {
            w = W;
            h = H;
          }
        }

        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        container.style.width = w + "px";
        container.style.height = h + "px";
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // Shows a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Side bar aspect rasio forcing.loader.js";
      var config = {
        dataUrl: buildUrl + "/Side bar aspect rasio forcing.data.unityweb",
        frameworkUrl: buildUrl + "/Side bar aspect rasio forcing.framework.js.unityweb",
        codeUrl: buildUrl + "/Side bar aspect rasio forcing.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "NoobsGames",
        productName: "Idle-Isekai",
        productVersion: "0.1.13",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          resizeCanvas();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

    </script>
  </body>
</html>
